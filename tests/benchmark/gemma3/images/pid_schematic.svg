  <!-- Main Process Pipe Line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#38bdf8" stroke-width="6"/>
  <text x="120" y="180" font-size="14" fill="#94a3b8" font-family="monospace">LINE: 6-HC-204-A1 (Crude Feed)</text>
  <!-- Isolation Valve HV-102 -->
  <polygon points="360,180 360,220 400,200" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <polygon points="440,180 440,220 400,200" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <rect x="385" y="140" width="30" height="25" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
