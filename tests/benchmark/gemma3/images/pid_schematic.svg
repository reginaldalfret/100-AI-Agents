  <text x="400" y="380" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="monospace">BYPASS LINE: 4-HC-204-BP (Manual Gate V-103)</text>
  <!-- Safety Relief Valve PSV-204 -->
