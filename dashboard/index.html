<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>100 → 1 AI Agents</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">100 → 1 AI AGENT PLATFORM</p>
        <h1>Agent Control Center</h1>
        <p class="subtitle">One interface for the complete 100-agent registry.</p>
      </div>
      <div id="control-status" class="status-pill">Checking control plane…</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="panel">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search agents…" autocomplete="off">
        <button id="refresh">Refresh</button>
      </div>
      <div id="agents" class="agents"></div>
    </section>

    <section id="workspace" class="panel hidden">
      <div class="workspace-header">
        <div>
          <p class="eyebrow" id="workspace-day"></p>
          <h2 id="workspace-name"></h2>
          <p id="workspace-id" class="muted"></p>
        </div>
        <button id="close-workspace">Close</button>
      </div>

      <div id="workspace-health" class="health-box"></div>

      <form id="run-form">
        <label for="task">Task</label>
        <textarea id="task" rows="6" placeholder="What should this agent do?"></textarea>

        <div class="form-row">
          <label>
            Tone
            <select id="tone">
              <option>professional</option>
              <option>friendly</option>
              <option>formal</option>
              <option>concise</option>
              <option>creative</option>
            </select>
          </label>
          <label>
            Output
            <select id="output-format">
              <option value="text">text</option>
              <option value="markdown">markdown</option>
              <option value="json">json</option>
              <option value="structured">structured</option>
            </select>
          </label>
        </div>

        <button class="primary" type="submit">Run Agent</button>
      </form>

      <pre id="result" class="result">Result will appear here.</pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
